[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MCRTD/schematic-wgpu"

[package]
name = "schematic-wgpu"
description = "Render and export Litematica schematics with wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["*.litematic"]

[[bin]]
name = "schematic"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
export = { package = "schematic-wgpu-export", version = "0.2.0", path = "crates/export" }
glam = "0.33.10"
image = { version = "0.25.10", default-features = false, features = ["png"] }
litematic = { package = "schematic-wgpu-litematic", version = "0.2.0", path = "crates/litematic" }
mc-assets = { package = "schematic-wgpu-mc-assets", version = "0.2.0", path = "crates/mc-assets" }
mesher = { package = "schematic-wgpu-mesher", version = "0.2.0", path = "crates/mesher" }
pollster = "1.0.1"
serde_json = "1.0.151"
viewer = { package = "schematic-wgpu-viewer", version = "0.2.0", path = "crates/viewer" }
