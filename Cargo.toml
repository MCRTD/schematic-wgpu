[workspace]
members = ["crates/*"]
resolver = "3"

[package]
name = "schematic-wgpu"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "schematic"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
export = { version = "0.1.0", path = "crates/export" }
glam = "0.33.10"
image = { version = "0.25.10", default-features = false, features = ["png"] }
litematic = { path = "crates/litematic" }
mc-assets = { version = "0.1.0", path = "crates/mc-assets" }
mesher = { version = "0.1.0", path = "crates/mesher" }
pollster = "1.0.1"
serde_json = "1.0.151"
viewer = { version = "0.1.0", path = "crates/viewer" }
