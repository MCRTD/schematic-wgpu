[package]
name = "web"
version = "0.1.0"
edition = "2024"
description = "Browser front end: loads schematics and Mojang assets, shows the viewer"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
export = { path = "../export" }
js-sys = "0.3.106"
litematic = { path = "../litematic" }
log = "0.4.34"
mc-assets = { path = "../mc-assets" }
mesher = { path = "../mesher" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
viewer = { path = "../viewer" }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement"] }
wgpu = { version = "30.0.1", features = ["webgl"] }
winit = "0.30.13"
