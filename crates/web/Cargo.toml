[package]
name = "schematic-wgpu-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser front end: loads schematics and Mojang assets, shows the viewer"
publish = false

[lib]
name = "web"
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
export = { package = "schematic-wgpu-export", version = "0.2.1", path = "../export" }
js-sys = "0.3.106"
litematic = { package = "schematic-wgpu-litematic", version = "0.2.1", path = "../litematic" }
log = "0.4.34"
mc-assets = { package = "schematic-wgpu-mc-assets", version = "0.2.1", path = "../mc-assets" }
mesher = { package = "schematic-wgpu-mesher", version = "0.2.1", path = "../mesher" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
viewer = { package = "schematic-wgpu-viewer", version = "0.2.1", path = "../viewer" }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement"] }
wgpu = { version = "30.0.1", features = ["webgl"] }
winit = "0.30.13"
