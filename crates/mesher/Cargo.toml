[package]
name = "schematic-wgpu-mesher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Build textured meshes from Litematica schematics"


[dependencies]
glam = "0.33.10"
litematic = { package = "schematic-wgpu-litematic", version = "0.2.0", path = "../litematic" }
mc-assets = { package = "schematic-wgpu-mc-assets", version = "0.2.0", path = "../mc-assets" }
thiserror = "2.0.21"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
