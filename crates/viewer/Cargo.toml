[package]
name = "viewer"
version = "0.1.0"
edition = "2024"
description = "wgpu renderer and interactive viewer for schematic meshes"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.33.10"
log = "0.4.34"
mesher = { path = "../mesher" }
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
