[package]
name = "mc-assets"
version = "0.1.0"
edition = "2024"
description = "Minecraft resource pack loading: blockstates, block models and textures"

[dependencies]
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
