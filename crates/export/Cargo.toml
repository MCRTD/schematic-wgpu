[package]
name = "export"
version = "0.1.0"
edition = "2024"
description = "Write meshes as glTF/GLB and OBJ"

[dependencies]
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png"] }
mesher = { path = "../mesher" }
serde_json = "1.0.151"

[dev-dependencies]
glam = "0.33.10"
gltf = { version = "1.4.1", features = ["import"] }
pollster = "1.0.1"
ufbx = "0.11.4"
viewer = { path = "../viewer" }
